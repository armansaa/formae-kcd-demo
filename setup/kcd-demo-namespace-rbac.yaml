# Prepared by the infra team (not formae): the demo namespace + write access for the formae agent.
#
# The formae agent uses GKEAuth without explicit credentials, so it reaches the GKE API server as
# the GSA formae-agent@kcd-2026 (Workload Identity / ADC). Its cluster-wide read access comes from
# project IAM (roles/viewer: read k8s objects except Secrets). Write access is deliberately limited
# to the kcd-demo namespace through the RBAC below.
#
#   kubectl apply -f setup/kcd-demo-namespace-rbac.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kcd-demo
  labels:
    owner: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: formae-agent-edit
  namespace: kcd-demo
subjects:
  - kind: User
    name: formae-agent@kcd-2026.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
