# Disiapkan tim infra (bukan formae): namespace demo + izin tulis untuk agent formae.
#
# Agent formae memakai GKEAuth tanpa kredensial eksplisit, jadi ia masuk ke API server GKE
# sebagai GSA formae-agent@kcd-2026 (Workload Identity / ADC). Izin baca ke seluruh cluster
# datang dari IAM project (roles/viewer: baca objek k8s kecuali Secret). Izin tulis sengaja
# hanya di namespace kcd-demo, lewat RBAC di bawah ini.
#
#   kubectl apply -f setup/kcd-demo-namespace-rbac.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kcd-demo
  labels:
    owner: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: formae-agent-edit
  namespace: kcd-demo
subjects:
  - kind: User
    name: formae-agent@kcd-2026.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
