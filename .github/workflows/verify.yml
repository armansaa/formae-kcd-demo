# verify — check on every PR: what would happen if this PR's content were applied to the agent?
#
# For bot PRs (branch reality-sync/*) the answer MUST be "no changes": that proves Git already
# matches reality. For human PRs, the planned changes are shown in the run summary.
name: verify

on:
  pull_request:
    paths:
      - "stacks/**"
      - "PklProject"

permissions:
  contents: read

jobs:
  simulate:
    # Public repo + self-hosted runner: NEVER run code from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: formae-kcd
    timeout-minutes: 10
    env:
      FORMAE_USER: ${{ secrets.FORMAE_USER }}
      FORMAE_PASSWORD: ${{ secrets.FORMAE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/write-ci-profile.sh
      - run: pkl project resolve
      - name: Simulate every stack
        env:
          BOT_PR: ${{ startsWith(github.head_ref, 'reality-sync/') }}
        run: |
          fail=0
          for f in stacks/*.pkl; do
            set +e
            formae apply --mode reconcile --simulate --profile ci \
              --output-consumer machine --output-schema json "$f" > sim.json 2> sim.err
            rc=$?
            set -e
            changes=$(jq -r '[.ChangesRequired, .Simulation.ChangesRequired, "drift"] | map(select(. != null)) | .[0]' sim.json 2>/dev/null || echo error)
            {
              echo "### \`$f\`: rc=$rc, ChangesRequired=$changes"
              echo '```json'
              head -c 4000 sim.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$BOT_PR" = "true" ] && { [ $rc -ne 0 ] || [ "$changes" != "false" ]; }; then
              echo "::error file=$f::Bot PR, but Git does not match reality yet"
              fail=1
            fi
          done
          exit $fail
