# Builds the ARC runner image with the formae CLI, pkl and jq preinstalled.
# Runs on a GitHub-hosted runner (no cluster access needed).
name: build-runner-image

on:
  push:
    branches: [main]
    paths: ["runner/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/formae-kcd-runner:0.90.5
            ghcr.io/${{ github.repository_owner }}/formae-kcd-runner:latest
