# reality-sync — reality wins, Git keeps the record.
#
# Every 10 minutes (and manually via "Run workflow"): check the stack for drift on the formae
# agent, absorb it automatically if it passes the guardrails, then open/update a PR that brings
# Git in line with reality. Drift that hits a guardrail opens an Issue instead.
#
# Runs on a self-hosted runner (ARC) INSIDE GKE, because the formae agent is ClusterIP only.
name: reality-sync

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

concurrency:
  group: formae-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: formae-kcd          # ARC runner scale set name (setup/arc/runner-scale-set.yaml)
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      matrix:
        stack:
          - { name: kcd-demo-app, file: stacks/kcd-demo-app.pkl }
    env:
      FORMAE_USER: ${{ secrets.FORMAE_USER }}
      FORMAE_PASSWORD: ${{ secrets.FORMAE_PASSWORD }}
    steps:
      - name: GitHub App token (bot)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - name: formae profile for the in-cluster agent
        run: ./scripts/write-ci-profile.sh

      - name: Resolve Pkl dependencies
        run: pkl project resolve

      - name: Detect and absorb drift
        id: sync
        run: ./scripts/reality-sync.sh "${{ matrix.stack.file }}" "${{ matrix.stack.name }}"

      - name: Run summary
        if: always() && steps.sync.outputs.summary != ''
        run: cat "${{ steps.sync.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open / update PR
        if: steps.sync.outputs.status == 'absorbed'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          branch: reality-sync/${{ matrix.stack.name }}
          delete-branch: true
          add-paths: ${{ matrix.stack.file }}
          commit-message: "reality-sync(${{ matrix.stack.name }}): absorb drift observed in cluster"
          title: "reality-sync: drift absorbed in ${{ matrix.stack.name }}"
          body-path: ${{ steps.sync.outputs.summary }}
          labels: reality-sync

      - name: Open Issue (drift blocked by guardrails)
        if: steps.sync.outputs.status == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
          STACK: ${{ matrix.stack.name }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          label="reality-sync-blocked"
          title="reality-sync BLOCKED: ${STACK}"
          open=$(curl -fsS "${auth[@]}" "$api/issues?state=open&labels=${label}" \
                 | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [ "$open" -gt 0 ]; then
            echo "An Issue for ${STACK} is still open, not creating another one."
            exit 0
          fi
          jq -n --arg t "$title" --rawfile b "$SUMMARY" --arg l "$label" \
             '{title: $t, body: $b, labels: [$l]}' \
          | curl -fsS "${auth[@]}" -X POST "$api/issues" -d @- > /dev/null
          echo "Issue created."
