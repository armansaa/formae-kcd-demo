# reality-sync for the formae under projects/kcd-2026 (agent formae-kcd, namespace formae-kcd).
# Same loop as reality-sync.yml, which covers stacks/ on the agent in namespace formae.
#
# Every 10 minutes (CronJob setup/arc/reality-sync-trigger-kcd-2026.yaml dispatches it) and
# manually via "Run workflow": for every forma under projects/ whose stack exists on the agent,
# check for drift, absorb it automatically if it passes the guardrails, then open/update a PR
# that brings Git in line with reality (the file is rewritten by `formae extract --desired`).
# Drift that hits a guardrail opens an Issue instead.
#
# Runs on the ARC runner scale set `formae-kcd` INSIDE GKE, because the formae agent is
# ClusterIP only (connection: .github/actions/formae-agent). The CronJob calls
# workflow_dispatch on this file name, so keep it reality-sync-kcd-2026.yml.
name: "reality-sync: kcd-2026"

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start scheduled runs late; the in-cluster CronJob is the real trigger
  workflow_dispatch:

concurrency:
  group: reality-sync-kcd-2026
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_DIR: projects/kcd-2026
  # Stacks left out of the loop. Cloud SQL is one-way (every update is refused by the GCP
  # plugin and extract fails on fields missing from the schema), and extract of the bucket
  # stack currently fails the same way.
  SKIP_STACKS: >-
    kcd-2026/bucket/formae-demo kcd-2026/cloudsql/cloudsql-demo
  # Only out-of-band *updates* of these types are absorbed without a human.
  ALLOWED_TYPES: >-
    GCP::Storage::Bucket GCP::SQL::DatabaseInstance
    K8S::Core::Namespace K8S::Core::ConfigMap K8S::Core::Service
    K8S::Apps::Deployment K8S::Batch::CronJob
    K8S::Autoscaling::HorizontalPodAutoscaler

jobs:
  stacks:
    runs-on: formae-kcd
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/formae-agent
        env:
          FORMAE_SYNC_WAIT: "0"   # the sync job below waits; this one only lists stacks

      # Every forma (folder with main.pkl) whose stack the agent knows. A forma
      # that was never applied has nothing that can drift, so it is skipped.
      - name: List formae with a stack on the agent
        id: list
        run: |
          known=$(formae inventory stacks --config "$FORMAE_CONFIG" --max-results 0 \
                    --output-consumer machine --output-schema json | jq -c '[.. | .Label? // empty]')
          echo "stacks on the agent: $known"
          matrix=$(for f in $(find "$PROJECT_DIR" -name main.pkl | sort); do
                     label=$(formae eval --config "$FORMAE_CONFIG" --output-consumer machine --output-schema json "$f" \
                               | jq -r '.Stacks[0].Label // empty') || continue
                     [[ -n "$label" ]] && jq -n --arg n "$label" --arg f "$f" '{name: $n, file: $f}'
                   done | jq -sc --argjson known "$known" --arg skip "$SKIP_STACKS" \
                     'map(select(.name as $n | ($known | index($n)) and ($skip | split(" ") | index($n) | not)))')
          echo "matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    needs: stacks
    if: needs.stacks.outputs.matrix != '[]'
    runs-on: formae-kcd
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.matrix) }}
    steps:
      - name: GitHub App token (bot)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: ./.github/actions/formae-agent

      - name: Detect and absorb drift
        id: sync
        run: .github/scripts/reality-sync.sh "${{ matrix.stack.file }}" "${{ matrix.stack.name }}"

      - name: Run summary
        if: always() && steps.sync.outputs.summary != ''
        run: cat "${{ steps.sync.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open / update PR
        if: steps.sync.outputs.status == 'absorbed'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          base: main
          branch: reality-sync/${{ matrix.stack.name }}
          delete-branch: true
          add-paths: ${{ matrix.stack.file }}
          commit-message: "reality-sync(${{ matrix.stack.name }}): absorb drift observed in the cloud"
          title: "reality-sync: drift absorbed in ${{ matrix.stack.name }}"
          body-path: ${{ steps.sync.outputs.summary }}
          labels: reality-sync

      - name: Open Issue (drift blocked by guardrails)
        if: steps.sync.outputs.status == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
          STACK: ${{ matrix.stack.name }}
        run: |
          label="reality-sync-blocked"
          title="reality-sync BLOCKED: ${STACK}"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label "$label" --json title \
                 | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [ "$open" -gt 0 ]; then
            echo "An Issue for ${STACK} is still open, not creating another one."
            exit 0
          fi
          gh label create "$label" -R "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$SUMMARY" --label "$label"
          echo "Issue created."
